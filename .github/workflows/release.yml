name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Required for npm Trusted Publishing. npm exchanges this OIDC token for the right
  # to publish — there is no NPM_TOKEN — and mints a provenance attestation tying the
  # tarball to this workflow run and commit. Neither is reproducible from a laptop.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Build, typecheck and test
        run: npx turbo build typecheck test

      - name: Assert the tag matches the package version
        working-directory: packages/icons
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "Publishing $version"

      # prepack re-runs typecheck, build and test here. The duplication is deliberate:
      # it is the last gate before an immutable artifact reaches the registry.
      # No NODE_AUTH_TOKEN: auth comes from the OIDC token, and provenance is automatic
      # under Trusted Publishing, so --provenance is not passed explicitly.
      - name: Publish
        run: npm publish --access public
        working-directory: packages/icons

      # If the trusted publisher were misconfigured, npm can fall back to publishing
      # without an attestation. That would succeed quietly, so check rather than assume.
      - name: Verify provenance was attached
        working-directory: packages/icons
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # The registry can lag a few seconds behind a publish, so retry before
          # concluding the attestation is genuinely missing.
          for attempt in 1 2 3 4 5; do
            attestations=$(npm view "$name@$version" dist.attestations --json 2>/dev/null || true)
            if [ -n "$attestations" ] && [ "$attestations" != "undefined" ]; then
              echo "Provenance attached to $name@$version"
              exit 0
            fi
            echo "Attempt $attempt: no attestation yet, waiting..."
            sleep 10
          done
          echo "::error::$name@$version was published without provenance — check the trusted publisher settings on npmjs.com"
          exit 1
